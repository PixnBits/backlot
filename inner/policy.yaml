# Backlot M1 demo profile — source of truth for the inner ring.
#
# Allow ls/cat of /workspace. Decoy at /opt/grok. Network none.
# allowed_binaries are informational; I3: binary name is not policy.

profile: demo
workspace: /workspace
network: none

# I2: never used as a bind *source*. A decoy may occupy the dest.
secret_paths:
  - /opt/grok
  - /root/.ssh
  - /home

# dest -> runtime (generated tree) or an explicit host directory that is
# itself not a secret path.
decoy_paths:
  /opt/grok: runtime

allowed_binaries:
  - ls
  - cat

# Host paths. Missing ones are skipped. Debian /bin -> usr/bin becomes --symlink.
ro_binds:
  - /usr
  - /bin
  - /lib
  - /lib64
  - /sbin

rw_binds: []

# Allow-list. I3 names listed under denied_syscalls cannot appear here.
allowed_syscalls:
  - read
  - write
  - open
  - close
  - stat
  - fstat
  - lstat
  - poll
  - lseek
  - mmap
  - mprotect
  - munmap
  - brk
